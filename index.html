<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0F0C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workouts">
  <title>My Workouts</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230E0F0C'/><path d='M28 52l14 14 30-32' fill='none' stroke='%23C8F03C' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <!-- The ?v= number makes phones download fresh copies. Raise it after every change to style.css or app.js. -->
  <link rel="stylesheet" href="style.css?v=5">
  <script>
    // Apply the saved theme before the page draws, so it doesn't flash.
    try { if (JSON.parse(localStorage.getItem('theme')) === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div id="dock"></div>
  <div id="overlay"></div>

  <nav class="tabs" aria-label="Main">
    <a href="#/" data-tab="week">
      <span class="tab-ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
      <span data-i18n="thisWeek">This week</span>
    </a>
    <a href="#/history" data-tab="history">
      <span class="tab-ic"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg></span>
      <span data-i18n="history">History</span>
    </a>
    <a href="#/profile" data-tab="profile">
      <span class="tab-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg></span>
      <span data-i18n="profile">Profile</span>
    </a>
  </nav>

  <script src="app.js?v=5"></script>
</body>
</html>
